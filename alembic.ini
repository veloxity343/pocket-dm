# Alembic command-line config, for creating migrations during development:
#   uv run alembic revision --autogenerate -m "describe the change"
#   uv run alembic upgrade head            (the app also does this on startup)
# Add `-x db=path/to/pocket-dm.db` to target a specific database.

[alembic]
script_location = %(here)s/src/pocket_dm/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
